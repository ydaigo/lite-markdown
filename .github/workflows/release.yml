name: release

# バージョンタグ（例: v0.1.0）を push すると、Mac / Windows の
# インストーラをビルドして GitHub Release に添付します。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例 v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # 自動更新は nightly チャネル専用。タグ付きリリースは素のインストーラを配るだけなので
      # --features updater / tauri.nightly.conf.json / VITE_UPDATER は渡さない
      # （.sig も latest.json も不要）。
      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "lite-markdown ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            ものすごく軽量な Markdown / メモアプリ。

            ### ダウンロード
            - **Windows**: `.msi` または `.exe` (NSIS)
            - **macOS**: `.dmg` (Intel / Apple Silicon 両対応 universal)

            > 署名なしのため、初回起動時に Windows SmartScreen / macOS Gatekeeper の警告が出ます。
            > Windows: 「詳細情報」→「実行」。 macOS: 右クリック →「開く」で許可してください。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
