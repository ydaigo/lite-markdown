name: nightly

# main への push ごとに Mac / Windows をビルドし、
# 固定タグ "nightly" の Prerelease を最新版で上書き公開します。
# 恒久URL: https://github.com/ydaigo/lite-markdown/releases/tag/nightly
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

# 連続 push 時は古い実行をキャンセルし、最新だけを反映。
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # updater は semver 比較で動くため、nightly でも version を単調増加させる。
      # patch を run 番号にすることで 0.1.42 -> 0.1.43 と確実に上がる。
      - name: Set nightly version (0.1.<run_number>)
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version='0.1.${{ github.run_number }}';fs.writeFileSync(f, JSON.stringify(c,null,2)+'\n');console.log('version =', c.version)"

      - name: Build app (installers + updater artifacts)
        run: npm run tauri -- build ${{ matrix.args }}
        env:
          # updater パッケージの署名鍵（GitHub Secrets に登録）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect installers & updater artifacts
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.sig" -o -name "*.tar.gz" \) \
            -path "*/release/bundle/*" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lite-markdown-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

  publish-nightly:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten & list
        run: |
          find dist -type f -exec mv {} dist/ \; 2>/dev/null || true
          find dist -maxdepth 1 -type f

      # updater が参照する更新マニフェスト。各プラットフォームの .sig と
      # アセットの DL URL から組み立てる。version は build と同じ run 番号。
      - name: Generate latest.json
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'EOF'
          const fs = require('fs'), path = require('path');
          const dir = 'dist';
          const base = 'https://github.com/ydaigo/lite-markdown/releases/download/nightly/';
          const files = fs.readdirSync(dir);
          const sig = (f) => fs.readFileSync(path.join(dir, f), 'utf8').trim();
          const platforms = {};
          // Windows: NSIS setup.exe が updater ターゲット
          const winExe = files.find((f) => /-setup\.exe$/.test(f));
          const winSig = files.find((f) => /-setup\.exe\.sig$/.test(f));
          if (winExe && winSig) {
            platforms['windows-x86_64'] = { signature: sig(winSig), url: base + encodeURIComponent(winExe) };
          }
          // macOS: universal .app.tar.gz を両アーキで共有
          const macTar = files.find((f) => /\.app\.tar\.gz$/.test(f));
          const macSig = files.find((f) => /\.app\.tar\.gz\.sig$/.test(f));
          if (macTar && macSig) {
            const e = { signature: sig(macSig), url: base + encodeURIComponent(macTar) };
            platforms['darwin-x86_64'] = e;
            platforms['darwin-aarch64'] = e;
          }
          if (Object.keys(platforms).length === 0) {
            console.error('更新アーティファクト(.sig)が見つかりません。署名鍵の Secrets を確認してください。');
            process.exit(1);
          }
          const manifest = {
            version: '0.1.' + process.env.RUN_NUMBER,
            notes: 'main の最新コミットから自動ビルドされた nightly です。',
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync(path.join(dir, 'latest.json'), JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          EOF

      - name: Publish/refresh "nightly" prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (latest main)"
          prerelease: true
          # 同名アセットは置き換え。nightly タグは最新コミットへ移動。
          body: |
            **main の最新コミットから自動ビルドされた最新版**です。

            - **Windows**: `.msi` または `.exe`（NSIS）
            - **macOS**: `.dmg`（Intel / Apple Silicon 両対応 universal）

            コミット: `${{ github.sha }}`

            > 署名なしのため初回起動時に警告が出ます。
            > Windows: 「詳細情報」→「実行」／ macOS: 右クリック →「開く」。
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/*.tar.gz
            dist/*.sig
            dist/latest.json
