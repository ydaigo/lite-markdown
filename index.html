<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lite-markdown</title>
    <!-- バンドル(CSS/JS)の読み込み前に背景色を確定させ、起動時の白いちらつきを防ぐ。
         色は styles.css の --bg と揃えること。 -->
    <style>
      html {
        background: #ffffff;
      }
      html[data-theme="dark"] {
        background: #1e1e22;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      // 保存済みテーマを最初の描画より前に反映する。未保存なら OS の設定に従う
      // （キーは prefs.ts、既定値の判定は store.ts の initialTheme() と対応）。
      (function () {
        var t = localStorage.getItem("lm.theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- 自作タイトルバー（ネイティブ装飾は無効。アイコン/アプリ名なし） -->
      <header id="titlebar" data-tauri-drag-region>
        <div class="tb-left">
          <button id="btn-sidebar" class="tb-btn" title="サイドバー表示切替">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" />
              <line x1="6" y1="2.5" x2="6" y2="13.5" />
            </svg>
          </button>
          <button id="btn-search" class="tb-btn" title="メモ検索 (Ctrl/Cmd+Shift+F)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              <circle cx="7" cy="7" r="4.5" />
              <line x1="10.6" y1="10.6" x2="14" y2="14" stroke-linecap="round" />
            </svg>
          </button>
          <button id="btn-settings" class="tb-btn" title="設定 (?)">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
        </div>

        <div class="tb-spacer" data-tauri-drag-region></div>

        <div class="tb-right">
          <!-- 新しいバージョンが見つかったときだけ updater.ts が表示する -->
          <button id="btn-update" class="tb-btn tb-text" title="新しいバージョンがあります" hidden>
            ⬆ <span id="btn-update-label">更新</span>
          </button>
          <button id="btn-toggle" class="tb-btn tb-text" title="プレビュー切替 (Ctrl/Cmd+E)">プレビュー</button>
          <button id="btn-theme" class="tb-btn" title="テーマ切替">🌙</button>
          <div class="tb-winctrls">
            <button id="win-min" class="tb-win" title="最小化" aria-label="最小化">
              <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1">
                <line x1="1" y1="5.5" x2="9" y2="5.5" />
              </svg>
            </button>
            <button id="win-max" class="tb-win" title="最大化" aria-label="最大化">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="1.3" y="1.3" width="7.4" height="7.4" rx="0.5" />
              </svg>
            </button>
            <button id="win-close" class="tb-win tb-win-close" title="閉じる" aria-label="閉じる">
              <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
                <line x1="1.2" y1="1.2" x2="8.8" y2="8.8" />
                <line x1="8.8" y1="1.2" x2="1.2" y2="8.8" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="body">
        <aside id="sidebar">
          <div id="ws-header">
            <button id="ws-btn" title="ワークスペースを切り替え">
              <span id="ws-name">…</span>
              <span class="chev">▾</span>
            </button>
            <div id="ws-menu" hidden></div>
          </div>
          <div id="search-bar" hidden>
            <input id="search-input" type="text" placeholder="メモを検索…" spellcheck="false" />
          </div>
          <div id="list-toolbar">
            <button id="btn-new" title="新規メモ (Ctrl/Cmd+N)">
              <span class="plus">＋</span> <span id="btn-new-label">新規メモ</span>
            </button>
          </div>
          <div id="note-list"></div>
        </aside>

        <div id="main">
          <main id="editor-area">
            <div id="editor"></div>
            <article id="preview" hidden></article>
            <!-- 本文幅を変えるつまみ。位置決めの入れ物は #preview と同じ幅の式で置き、
                 その外側（余白側）につまみを重ねる（幅の反映と操作は preview-width.ts） -->
            <div id="pv-resize" hidden>
              <div id="pv-resize-handle" role="separator" aria-orientation="vertical"></div>
            </div>
            <!-- プレビュー内検索。プレビューの上に重ねて出す（開閉は preview-search.ts） -->
            <div id="pv-find" hidden>
              <input id="pv-find-input" type="text" placeholder="プレビュー内を検索…" spellcheck="false" />
              <span id="pv-find-count">0/0</span>
              <button id="pv-find-prev" class="pv-find-btn" title="前へ">‹</button>
              <button id="pv-find-next" class="pv-find-btn" title="次へ">›</button>
              <button id="pv-find-close" class="pv-find-btn" title="閉じる">✕</button>
            </div>
            <div id="empty-state" hidden>メモがありません。<br />「＋ 新規メモ」で始めましょう。</div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
